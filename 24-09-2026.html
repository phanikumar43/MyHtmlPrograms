    <!--
        1)What is Table in HTML?
            Table is a collection of rows and columns which is used to display data in a tabular form.
            There are Several tags which are used to create a table in HTML. The tags are:
                1)Thead: Thead tag is used to create a table header. It is used to group the header content in a table.
                2)Tbody: Tbody tag is used to group the body content in atable. It is used to group the rows of a table.
                3)tr: Tr tag is used to create a table row. It is used to group the cells of a table.
                4)td: Td tag is used to create a table cell. It is used to group the data of a table.
                5)th: Th tag is used to create a table header cell. It is used to group the header data of a table.
                6)caption: Caption tag is used to create a table caption. It is used to group the caption of a table.

        2)What are the properties of Table in HTML?
            There are several properties which are used to create a table in HTML. The properties are:
                1)colspan: Colspan property is used to merge the cells of a table. It is used to merge the cells of a table horizontally.
                2)rowspan: Rowspan property is used to merge the cells of a table. It is used to merge the cells of a table vertically.
    -->
     <table border="3">
        <tbody>
            <tr>
                <th>Name</th>
                <th>Surname</th>
                <th>RollNo</th>
                <th>Marks</th>
            </tr>
            <tr>
                <td rowspan="1">Nani</td>
                <td rowspan="1">samavedam</td>
                <th>7105</th>
                <th>100</th>
            </tr>
            <tr>
                <td>Phani</td>
                <td></td>
                <td>7105</td>
                <td>98</td>
            </tr>
        </tbody>
     </table>
