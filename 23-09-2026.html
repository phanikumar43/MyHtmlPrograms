    <!--
            1.ul(unordered list)
            2.Property:-list-style-type
            3.values:-disc, circle, square, none
            4.<ol type="a" start="3">
            5.dl(description list)
            6.toggle device toolbar
            7.meta name="viewport" content="width=device-width, initial-scale=1.0"
            8.meta charset="UTF-8"
            9.meta name="author" content="name"
            10.meta name="description" content="description"
            11.meta name="keywords" content="keywords"
    -->

    <!--
        1)ul:-
          1.ul stands for unordered list.
          2.ul is used to create a list of items in no particular order.
          example:-
          <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
          </ul>

        2.Property:-list-style-type:-
            1.list-style-type is a CSS property that specifies the type of list item marker to be used in an unordered list.
            2.values:-disc, circle, square, none
            example:-
            <ul style="list-style-type:disc">
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
            </ul>

        3.values:-disc, circle, square, none:-
            1.disc:-The disc value displays a filled circle as the list item marker.
            2.circle:-The circle value displays an empty circle as the list item marker.
            3.square:-The square value displays a filled square as the list item marker.
            4.none:-The none value removes the list item marker, resulting in no visible marker for the list items.   

        4.<ol type="a" start="3">:-
            means ordered list with type "a" (lowercase letters) starting from 3.
            example:-
            <ol type="a" start="3">
                <li>Item 3</li>
                <li>Item 4</li>
                <li>Item 5</li>
            </ol>

        5.dl(description list):-
            1.dl stands for description list.
            2.dl is used to create a list of terms and their corresponding descriptions.
            example:-
            <dl>
                <dt>Term 1</dt>
                <dd>Description for Term 1</dd>
                <dt>Term 2</dt>
                <dd>Description for Term 2</dd>
            </dl>
            Note:-
            we can write multiple dd for a single dt.

        6.toggle device toolbar:-
            1.toggle device toolbar is a feature in web browsers that allows developers to simulate how a website or web application will appear and behave on different devices, such as smartphones, tablets, and desktops.
            2.It provides a way to test the responsiveness and layout of a website across various screen sizes and resolutions.
            3.It helps developers identify and fix issues related to mobile responsiveness, ensuring that the website looks and functions well on different devices.

         7.meta name="viewport" content="width=device-width, initial-scale=1.0":-
            1.This meta tag is used in HTML documents to control the viewport settings for responsive web design.
            2.It helps ensure that web pages are displayed correctly on different devices, especially on mobile devices with varying screen sizes.
            3.The "width=device-width" part sets the width of the viewport to match the width of the device's screen, allowing the content to scale appropriately.
            4.The "initial-scale=1.0" part sets the initial zoom level when the page is first loaded, ensuring that the content is displayed at its intended size.

        8.meta charset="UTF-8":-
            1.This meta tag specifies the character encoding for the HTML document.
            2.UTF-8 (Unicode Transformation Format - 8-bit) is a widely used character encoding that can represent a vast range of characters from different languages and scripts.
            3.By including this meta tag, you ensure that the browser correctly interprets and displays the text content of your web page, including special characters and symbols.

        9.meta name="author" content="name":-
            1.This meta tag is used to specify the author of the HTML document. 
            2.It provides information about the individual or organization responsible for creating the web page.

        10.meta name="description" content="description":-
            1.This meta tag is used to provide a brief description of the content of the HTML document.
            2.Search engines often use this description in search results, so it's important for SEO (Search Engine Optimization) purposes.

        11.meta name="keywords" content="keywords":-
            1.This meta tag is used to specify a list of keywords relevant to the content of the HTML document.
            2.Search engines may use these keywords to understand the topic of the page, although their importance for SEO has diminished over time.    
    -->
