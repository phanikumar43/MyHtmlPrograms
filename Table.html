<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>23-09-2026</title>
</head>
<body>
    <!--Using HTML Table Tags Create a Table , and add few rows-->
    <!--
        HTML Table Tags:-
            1)table
            2)tr
            3)th
            4)td

        1)table:-
            1)The table tag is used to create a table in HTML.
            2)It serves as a container for organizing and displaying data in a tabular format.
            example:-
            <table>
                <tr>
                    <th>Header 1</th>
                    <th>Header 2</th>
                </tr>
                <tr>
                    <td>Data 1</td>
                    <td>Data 2</td>
                </tr>
            </table>

        2)tr:-
            tr stands for "table row" and is used to define a row within a table.
            1)The tr tag is used to define a table row within a table.
            2)It is used to group together table cells (th or td) that belong to the same row.
            example:-
            <table>
                <tr>
                    <th>Header 1</th>
                    <th>Header 2</th>
                </tr>
                <tr>
                    <td>Data 1</td>
                    <td>Data 2</td>
                </tr>
            </table>

        3)th:-
            th stands for "table header" and is used to define a header cell within a table.
            1)The th tag is used to define a table header cell within a table.
            2)It is typically used to provide headings for columns or rows in a table.
            example:-
            <table>
                <tr>
                    <th>Header 1</th>
                    <th>Header 2</th>
                </tr>
                <tr>
                    <td>Data 1</td>
                    <td>Data 2</td>
                </tr>
            </table>

        4)td:-
             td stands for "table data" and is used to define a standard cell within a table.
            1)The td tag is used to define a table data cell within a table.
            2)It is used to hold the actual data or content of a table.
            example:-
            <table>
                <tr>
                    <th>Header 1</th>
                    <th>Header 2</th>
                </tr>
                <tr>
                    <td>Data 1</td>
                    <td>Data 2</td>
                </tr>
            </table>
    -->
    <h1>Table Creation</h1>
    <table>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>place</th>
        </tr>
        <tr>
            <td>nani</td>
            <td>26</td>
            <td>Mukkamala</td>
        </tr>
    </table>
</body>
</html>
